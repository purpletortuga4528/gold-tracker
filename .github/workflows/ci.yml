name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because two of these go stale on their own rather than when someone
  # changes the code: the IMF snapshot ages, and an advisory can be published
  # against a dependency nobody has touched.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.22 is the floor the root package declares, set by jsdom 30 and
        # jsdom 30. 24 is what this was developed on. Testing the floor makes
        # it a fact rather than a hope.
        node: ['22.22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm run setup

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Coverage floor
        # Thresholds live in frontend/vite.config.js. A floor, not a target:
        # the exact figure the README quotes is checked by the docs job.
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  backend-floor:
    # The API declares a lower floor than the test tooling, so that claim needs
    # its own proof. The frontend suite cannot run here, and is not asked to.
    name: API runs on its declared floor (Node 20.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.6'

      - name: Install backend only
        run: npm install --prefix backend

      - name: Backend tests
        run: npm run test:backend

      - name: Serves real data
        run: |
          npm start --prefix backend &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:5174/api/health && break
            sleep 1
          done
          curl -sf 'http://127.0.0.1:5174/api/reserves?limit=1' | grep -q '"countryCode":"USA"'

  production:
    # The self-hosting path is the one a user actually runs, so it gets checked
    # end to end rather than assumed to follow from the parts.
    name: Production single-process serving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      - name: Build and start, one process on one port
        run: |
          npm start > /tmp/prod.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:5174/api/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5174/api/health || { cat /tmp/prod.log; exit 1; }

      - name: The app is served, and client routes survive a refresh
        run: |
          for path in / /countries /countries/USA '/compare?codes=POL'; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://127.0.0.1:5174${path}")
            [ "$code" = "200" ] || { echo "${path} -> ${code}"; exit 1; }
            grep -q 'id="root"' /tmp/body || { echo "${path} did not return the app"; exit 1; }
          done

      - name: A missing asset is a 404, not the app shell
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:5174/assets/nope.js)
          [ "$code" = "404" ] || { echo "expected 404, got ${code}"; exit 1; }
          grep -q 'id="root"' /tmp/body && { echo "returned the app shell"; exit 1; }
          echo ok

      - name: The API is not shadowed by the app
        run: |
          curl -sf http://127.0.0.1:5174/api/reserves?limit=1 | grep -q '"countryCode":"USA"'
          curl -s http://127.0.0.1:5174/api/nope | grep -q '"error"'

      - name: The app and the API carry different policies
        run: |
          app=$(curl -si http://127.0.0.1:5174/ | grep -i '^content-security-policy:')
          api=$(curl -si http://127.0.0.1:5174/api/health | grep -i '^content-security-policy:')
          echo "$app" | grep -q "default-src 'self'"  || { echo "app CSP wrong: $app"; exit 1; }
          echo "$api" | grep -q "default-src 'none'"  || { echo "api CSP wrong: $api"; exit 1; }
          echo "$app" | grep -qE "https?://" && { echo "app CSP allows an external origin"; exit 1; }
          echo ok

  container:
    # The Dockerfile is a deployment claim, so it gets built and run rather
    # than assumed to work.
    name: Container builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t gold-tracker:ci .

      - name: Run it
        run: |
          docker run -d --name gt -p 5174:5174 gold-tracker:ci
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5174/api/health && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:5174/api/health || { docker logs gt; exit 1; }

      - name: Serves the app and the API
        run: |
          curl -sf http://127.0.0.1:5174/ | grep -q 'id="root"'
          curl -sf 'http://127.0.0.1:5174/api/reserves?limit=1' | grep -q '"countryCode":"USA"'

      - name: Runs as a non-root user
        run: |
          uid=$(docker exec gt id -u)
          [ "$uid" != "0" ] || { echo "container runs as root"; exit 1; }
          echo "uid ${uid}"

      - name: Build tooling is not in the runtime image
        run: |
          for path in /app/frontend/node_modules /app/backend/test /app/.git; do
            docker exec gt sh -c "test -e ${path}" && { echo "${path} present"; exit 1; }
          done
          echo ok

      - name: Stops cleanly rather than being killed
        run: |
          start=$(date +%s%N)
          docker stop gt > /dev/null
          elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "stopped in ${elapsed}ms"
          [ "$elapsed" -lt 5000 ] || { echo "took too long; signals may not be reaching node"; exit 1; }
          docker logs gt 2>&1 | grep -q "stopped cleanly"

  browser:
    name: Accessibility in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      - name: Install Chromium
        # Only the browser this needs. --with-deps pulls the system libraries
        # the GitHub runner does not ship.
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Contrast, axe, and the keyboard, in all four appearance modes
        # Three things a browser is needed for. Contrast of every rendered
        # element, which the palette test cannot see because it cannot know
        # what a component actually renders. axe, for the structural rules.
        # And driving the keyboard, because nothing else answers whether the
        # thing can be used without a mouse.
        run: npm run test:browser

      - name: Keep the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: frontend/test-results/
          retention-days: 7

  checks:
    name: Data and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      - name: Documented figures still match reality
        # The static half, plus --counts, which reruns both suites so the test
        # totals quoted in the README cannot drift. The live half runs in the
        # `live` job, so a network failure is never mistaken for a stale
        # document.
        run: npm run check:docs -- --counts

      - name: Reserves snapshot freshness
        # Exits 1 ageing, 2 stale. Reported, not enforced: the snapshot ageing
        # is a fact about the IMF's publishing schedule and the age of this
        # checkout, not a fault in the change being tested. The weekly run is
        # what makes it visible.
        run: npm run check:freshness --prefix backend
        continue-on-error: true

  upstream:
    name: The two feeds still mean what the code assumes
    # Weekly and on demand, not on every push. The ingest is the one thing here
    # that depends on somebody else's API being up, and a red build on every
    # pull request because the IMF was restarting would teach people to ignore
    # red builds. A week is well inside IRFCL's monthly publication cycle.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      - name: Keep the committed snapshot to compare against
        run: cp backend/data/gold-reserves.json committed-snapshot.json

      - name: Rebuild from the IMF
        # About four seconds against the live API. The unit tests cover the
        # detection functions with fixtures; nothing covered the fetching, the
        # SDMX parsing, the sector choice or the write until this.
        #
        # Exit 3 means the price reference was unavailable, so unit detection
        # could not run and nothing was attempted. The IMF half is fetched
        # before that point, so a shape change there still fails properly. An
        # upstream feed being blocked is not a broken pipeline and must not go
        # red, for the same reason this job is weekly in the first place.
        id: rebuild
        run: |
          set +e
          npm run build:data
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "rebuilt=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No price reference available, so the snapshot was not rebuilt. The IMF side was still fetched and parsed."
            exit 0
          fi
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          exit $code

      - name: The fresh snapshot is sound
        # Fails on shapes that mean the pipeline broke: no entries, a collapsed
        # country count, the US anchor moving, an implausible holding getting
        # published, data going backwards. It does NOT fail because figures
        # moved, which is the data working rather than the code breaking.
        #
        # Skipped when nothing was rebuilt, because comparing the committed
        # snapshot against itself proves nothing and reads like a pass.
        if: steps.rebuild.outputs.rebuilt == 'true'
        run: npm run check:ingest -- --before committed-snapshot.json --after backend/data/gold-reserves.json

      - name: Keep the fresh snapshot
        # So the difference can be inspected, and committed deliberately by a
        # person rather than pushed by a workflow.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-snapshot
          path: backend/data/gold-reserves.json
          retention-days: 14

      - name: The LBMA feed still means what the provider reads
        # lbma.js takes the price by position from an unlabelled array. A
        # reordered feed would not fail: it would report the euro price as
        # dollars, and every figure on every page would look normal. Runs even
        # if the ingest step above failed, because they are separate feeds and
        # one being down says nothing about the other.
        if: always()
        run: npm run check:price-feed

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      # Run per package: a bare `npm audit` at the root would miss the
      # overrides in backend/package.json, which is where qs is pinned above
      # what express asks for.
      - name: Backend
        run: npm audit --audit-level=moderate --prefix backend

      - name: Frontend
        run: npm audit --audit-level=moderate --prefix frontend

  live:
    name: End to end against a running API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        run: npm run setup

      - name: Start the API
        run: |
          npm start --prefix backend &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:5174/api/health; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not start"; exit 1

      - name: Documented sizes still match a live response
        # Also measures the real history payload, compressed and not. When the
        # LBMA feed is unreachable from the runner it reports those two claims
        # as SKIP rather than STALE: an upstream outage is not evidence that a
        # documented figure is wrong, and failing here would teach people to
        # ignore this job.
        run: npm run check:docs -- --live

      - name: Every API path is rate limited
        # A path that answers with no RateLimit header at all is the bypass
        # this repo has already had once, via /api/healthz.
        run: |
          for path in /api/health /api/healthz /api/health/sub /api/reserves /api/price/current /api/nope //api/reserves /api//reserves; do
            curl -si "http://127.0.0.1:5174${path}" -o /tmp/headers
            grep -qi '^ratelimit:' /tmp/headers || { echo "no rate limit on ${path}"; exit 1; }
          done
          echo "every path carries a RateLimit header"

      - name: Error bodies leak no paths or upstream URLs
        run: |
          for path in '/api/reserves?kind=a&kind=b' '/api/reserves/ZZZ' '/api/nope' '/api/reserves?limit=0'; do
            body=$(curl -s "http://127.0.0.1:5174${path}")
            if echo "$body" | grep -qE '"error":"[^"]*(/home/|/Users/|node_modules|https?://)'; then
              echo "leak from ${path}: ${body}"; exit 1
            fi
          done
          echo "no leaks"

      - name: Repeated query parameters are rejected, not crashed on
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            'http://127.0.0.1:5174/api/reserves?kind=a&kind=b')
          [ "$status" = "400" ] || { echo "expected 400, got ${status}"; exit 1; }
